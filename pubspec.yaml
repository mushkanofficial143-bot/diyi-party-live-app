name: diyo_party_live
description: Diyo Party Live - Premium social party live streaming app with wallet, gifts, and host earnings.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Navigation
  go_router: ^12.0.0

  # UI Components
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  dio: ^5.3.0
  get_it: ^7.6.0

  # Google Sign In
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0

  # Phone OTP
  firebase_phone_auth_handler: ^1.0.0

  # Image Picker
  image_picker: ^1.0.0
  image_cropper: ^5.0.0

  # Video/Live Streaming (if needed)
  agora_rtc_engine: ^6.3.0
  agora_chat: ^1.1.0

  # Payment Integration
  google_pay: ^2.1.0
  in_app_purchase: ^3.1.0

  # Notifications
  awesome_notifications: ^0.9.0

  # Form Validation
  form_builder_validators: ^9.1.0
  flutter_form_builder: ^9.1.0

  # Logging & Analytics
  firebase_analytics: ^10.7.0
  sentry_flutter: ^7.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
